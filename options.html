<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>休息提醒设置</title><link rel="stylesheet" href="ui.css"></head><body class="page"><h1>休息提醒设置</h1><p class="intro">所有默认参数都可以调整。插件打开时持续计时，电脑锁屏或睡眠时自动暂停。</p><section class="card"><h2>计时参数</h2><div class="grid"><div class="field"><label for="work">工作间隔（分钟）</label><input id="work" type="number" min="1" max="240"></div><div class="field"><label for="break">休息时长（分钟）</label><input id="break" type="number" min="1" max="120"></div></div></section><section class="card"><h2>提醒时间轴</h2><p class="muted">拖动下方时间输入框的时间，设置一个或多个工作时段。时段之外自动视为休息。</p><div class="timeline"></div><div class="axis"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div><div id="windows"></div><button id="add" class="add">＋ 添加工作时段</button></section><section class="card"><h2>声音提醒</h2><div class="grid"><div class="field"><label for="sound">声音</label><select id="sound"><option value="alarm">闹钟式铃声</option><option value="soft">柔和铃声</option></select></div><div class="field"><label for="volume">音量（0 - 100）</label><input id="volume" type="number" min="0" max="100"></div></div><div class="field" style="margin-top:18px"><label for="custom">自定义声音（可选，MP3/WAV/OGG）</label><input id="custom" type="file" accept="audio/*"></div></section><button id="save" class="save">保存设置</button><span id="saved" class="saved"></span><script src="options.js"></script></body></html>
